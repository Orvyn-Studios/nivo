name: Windows development validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nivo-mvp
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'test/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.mjs'

permissions:
  contents: read

concurrency:
  group: nivo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare Rust MSVC
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable-x86_64-pc-windows-msvc
      - run: npm ci --no-fund
      - name: Types, tests, lint and autonomous Windows executable
        run: npm run verify
      - run: npx playwright install chromium
      - name: Browser preview acceptance
        run: npm run test:ui
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nivo-validation-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
